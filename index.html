function jumbleTiles(){let best=null;
  for(let t=0;t<40;t++){const rots=stickers.map(s=>s.center||s===on?0:Math.floor(Math.random()*4));stickers.forEach((s,i)=>s.rot=rots[i]);
    let n=0;const seen=new Set([on]),q=[on];while(q.length){const x=q.shift();for(const w of worldExits(x)){const nb=linked(x,w);if(nb&&!seen.has(nb.st)){seen.add(nb.st);q.push(nb.st);n++}}}

const ENTRANCE_PLAN=['D-1,-1','L0,-1','L1,-1','B1,0','L0,0','L1,0','B1,1','U-1,0','L1,1','D0,-1','D0,0','D0,1','B0,0','F0,0','B0,1','U0,0','U0,-1','B-1,-1','R0,-1','D1,1','R1,0','R0,0','R-1,0','U1,1','R0,1','U1,-1'];

  // keep one dot per piece. See docs/images/entrances_26.png.
  const pick=f=>stickers.filter(s=>s.face===f&&ENTRANCE_PLAN.includes(f+s.cu+','+s.cv));
  const white=pick('U'),blue=pick('B'),orange=pick('L'),yellow=pick('D'),pink=pick('R'),green=pick('F');
  const tutorial=white.find(s=>s.cu===-1&&s.cv===0)||white.find(s=>!s.center)||white[0];

  let blueIndex=0;

    let type='sudoku6',role='white';

  const B=(t,f,id,cls='')=>{const b=document.createElement('button');b.className='b '+cls;if(id)b.id=id;b.innerHTML=t;b.onclick=f;row.appendChild(b);return b};
  if(where==='surface'){
    if(entAt(on)&&arrived&&!painting)B('Enter',enterRoom,'puzb','go3 pulse');
    const seg=document.createElement('div');seg.className='seg';row.appendChild(seg);
    [['puzzle','Rotate cube'],['explore','Walk']].forEach(([m,t])=>{const b=document.createElement('button');b.className='segb'+(mode===m?' on':'');b.innerHTML=t;b.onclick=()=>setMode(m);if(m!==mode)b.id='modeb';seg.appendChild(b)});
    if(painting)B('✕ Cancel pen',()=>{painting=false;hud()});
    else if(mode==='puzzle'){B('↶',undoTurn,'',(myTurns.length?'':'dim ')+'sq').title='Undo';B('◀',()=>{az+=90;act()},'','sq');B('▶',()=>{az-=90;act()},'','sq')}}
  else if(where==='room'){if((room.kind==='A'||room.kind==='B')&&!room.done)B('⟲ Reset',resetRoom);if(room.kind==='solar'&&!room.done){B('⟳ Rotate mirror (R)',solarRotate,'solrot');B('⟲ Reset',solarReset)}if(room.kind==='yp'&&!room.done){if(room.g==='shadow'){B('↻ Turn',()=>ypTurn('turn'),'ypturn');B('⤾ Tip',()=>ypTurn('tip'),'yptip')}B('⟲ Reset',ypReset,'ypreset')}B('Return to surface',leaveRooms,'leaveb',leaveGlow?'go3 pulse':'')}
  if(where==='surface'&&ENT.length&&ENT.every(x=>x.solved))B('◉ Enter the Core',()=>{busy=true;fade(1,.5).then(()=>{cube.visible=false;scene.attach(player);body.rotation.set(-Math.PI/2,0,0);toCore()})},'coreb','go3 pulse');
  const g=$('gest');g.textContent=where==='surface'?(painting?'Tap any tile to draw a crossroad':mode==='puzzle'?'Rotate cube: swipe row · tap path · undo available':'Walk: tap connected tile or use arrow keys · drag to look'):where==='room'?(room.hits?'Tap things in the room · Tap a bag item to use it':'Move with arrows or tap · drag to look · Return to surface exits'):'';
  // bag
  const iv=$('inv');iv.innerHTML=inv.length?'<div class="ttl">BAG</div>':'<div class="ttl">BAG · empty</div>';
  inv.forEach(it=>{const d=document.createElement('button');d.className='chip';d.dataset.id=it.id;d.title=it.name;d.innerHTML=`<span style="color:${it.color}">${it.glyph}</span>`;d.onclick=()=>useItem(it);iv.appendChild(d)})}
function toast(s){const el=$('toast');el.innerHTML=s.replace(/\n/g,'<br><span style="font-size:16px;font-weight:600">');el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,2000)}

// ================= loop =================
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,now=performance.now();
  stickers.forEach(s=>{if(s.black)s.cover.material.emissive.setRGB(.22+.18*Math.sin(t*4),.06+.05*Math.sin(t*4),0)});
  halo.position.z=.5+Math.sin(t*3)*.03;ENT.forEach((e,i)=>{if(!e.solved&&e.dot.userData.glow)e.dot.userData.glow.material.opacity=.18+.14*Math.sin(t*2+i)});if(beacon.visible){beacon.userData.fr.material.opacity=.6+.4*Math.sin(t*4);beacon.userData.col.material.opacity=.2+.15*Math.sin(t*4)}
  
  hintM.material.opacity=hintUntil>now?.55+.35*Math.sin(t*6):Math.max(0,hintM.material.opacity-dt*2);
  if(room&&room.sh){const cd=V(cam.position.x,0,cam.position.z).normalize();room.sh.walls.forEach(w=>{const vis=w.userData.n.dot(cd)<.35;w.visible=vis;if(w.userData.win){w.userData.win.visible=vis;w.userData.fr.visible=vis}})}
  if(room&&room.kind==='waterReveal'&&!busy){player.position.y=RY+.18+Math.sin(t*2.2)*.025;if(room.ripple){room.ripple.position.x=player.position.x;room.ripple.position.z=player.position.z;room.ripple.scale.setScalar(1+.08*Math.sin(t*2.2));room.ripple.material.opacity=.5+.15*Math.sin(t*2.2)}}
  if(room&&room.kind==='blueAlign'&&!room.done)checkBlueAlignment();
  if(room&&room.kind==='core')room.holo.rotation.y=t*.4;if(room&&room.ring)room.ring.material.opacity=.55+.45*Math.sin(t*4);
  camUpdate(dt);ren.render(scene,cam)}
stickers.forEach(s=>s.homeW=worldExits(s));// remember how every tile is drawn on the finished cube
scramble(20);queue.push({axis:AX[0],idx:9,dir:0,dur:0,res:()=>{log.length=log.length;standOn(startSticker());setTimeout(()=>started=true,50);faceCamTo(V(0,1,0));camSnap();jumbleTiles();makeEntrances();tuneStart();refreshGoal();hud();setTimeout(()=>toast('Find a way to the glowing tile'),600)}});
loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

</script>
