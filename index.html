<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= scene =================
const scene=new THREE.Scene();{const c=document.createElement('canvas');c.width=4;c.height=512;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#0b0d1c');g.addColorStop(.55,'#171a36');g.addColorStop(1,'#2e2550');x.fillStyle=g;x.fillRect(0,0,4,512);scene.background=new THREE.CanvasTexture(c)}
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;document.body.appendChild(ren.domElement);
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,300);
scene.add(new THREE.HemisphereLight(0xfff6ee,0x6a5a9a,.7));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(5,8,6);scene.add(sun);scene.add(sun.target);
const dl2=new THREE.DirectionalLight(0xffffff,.25);dl2.position.set(-6,-3,-5);scene.add(dl2);
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(c),roughness:.55},o));
const $=id=>document.getElementById(id);const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const tween=(dur,fn)=>new Promise(res=>{const t0=performance.now();(function f(){const k=dur?Math.min(1,(performance.now()-t0)/1000/dur):1;fn(k);k<1?requestAnimationFrame(f):res()})()});
const wait=s=>new Promise(r=>setTimeout(r,s*1000));
const G=1.02;

// ================= the cube: 27 cubies, 54 path stickers =================
const FACES=[
  {k:'U',n:V(0,1,0), u:V(1,0,0), v:V(0,0,-1),col:'#fff6e6'},
  {k:'D',n:V(0,-1,0),u:V(1,0,0), v:V(0,0,1), col:'#ffcf3f'},
  {k:'F',n:V(0,0,1), u:V(1,0,0), v:V(0,1,0), col:'#4fcf8c'},
  {k:'B',n:V(0,0,-1),u:V(-1,0,0),v:V(0,1,0), col:'#5aa2ff'},
  {k:'R',n:V(1,0,0), u:V(0,0,-1),v:V(0,1,0), col:'#ff6b81'},
  {k:'L',n:V(-1,0,0),u:V(0,0,1), v:V(0,1,0), col:'#ff9a45'}];
// every corner keeps at least one link, so a solved face is always fully connected
const RING={U:['-1,1,u','1,1,u','-1,-1,u','1,-1,u','-1,1,v','-1,-1,v','1,1,v','1,-1,v'],// square ring
  D:['-1,1,u','1,1,v','1,-1,u','-1,-1,v'],   // pinwheel
  F:['-1,1,v','-1,-1,v','1,1,v','1,-1,v'],   // two side bars
  B:['-1,1,u','1,1,u','-1,-1,u','1,-1,u'],   // top & bottom bars
  R:['-1,1,v','1,1,u','1,-1,v','-1,-1,u'],   // pinwheel the other way
  L:['-1,1,u','1,1,u','-1,-1,v','1,-1,u']};  // a hook
const HAM={"U:-1,-1":[[0,1],[1,0]],"U:0,-1":[[-1,0],[1,0]],"U:1,-1":[[-1,0],[0,-1]],"F:1,1":[[0,1],[1,0]],"R:-1,1":[[-1,0],[0,-1]],"R:-1,0":[[0,1],[-1,0]],"F:1,0":[[1,0],[-1,0]],"F:0,0":[[1,0],[0,1]],"F:0,1":[[0,-1],[-1,0]],"F:-1,1":[[1,0],[0,-1]],"F:-1,0":[[0,1],[0,-1]],"F:-1,-1":[[0,1],[1,0]],"F:0,-1":[[-1,0],[1,0]],"F:1,-1":[[-1,0],[1,0]],"R:-1,-1":[[-1,0],[0,-1]],"D:1,1":[[1,0],[-1,0]],"D:0,1":[[1,0],[-1,0]],"D:-1,1":[[1,0],[-1,0]],"L:1,-1":[[0,-1],[0,1]],"L:1,0":[[0,-1],[0,1]],"L:1,1":[[0,-1],[-1,0]],"L:0,1":[[1,0],[0,-1]],"L:0,0":[[0,1],[0,-1]],"L:0,-1":[[0,1],[0,-1]],"D:-1,0":[[-1,0],[1,0]],"D:0,0":[[-1,0],[1,0]],"D:1,0":[[-1,0],[1,0]],"R:0,-1":[[0,-1],[0,1]],"R:0,0":[[0,-1],[0,1]],"R:0,1":[[0,-1],[0,1]],"U:1,0":[[1,0],[-1,0]],"U:0,0":[[1,0],[0,1]],"U:0,1":[[0,-1],[1,0]],"U:1,1":[[-1,0],[1,0]],"R:1,1":[[0,1],[0,-1]],"R:1,0":[[0,1],[0,-1]],"R:1,-1":[[0,1],[0,-1]],"D:1,-1":[[1,0],[0,-1]],"B:-1,-1":[[0,-1],[0,1]],"B:-1,0":[[0,-1],[0,1]],"B:-1,1":[[0,-1],[1,0]],"B:0,1":[[-1,0],[0,-1]],"B:0,0":[[0,1],[0,-1]],"B:0,-1":[[0,1],[0,-1]],"D:0,-1":[[0,-1],[-1,0]],"D:-1,-1":[[1,0],[0,-1]],"B:1,-1":[[0,-1],[1,0]],"L:-1,-1":[[-1,0],[0,1]],"L:-1,0":[[0,-1],[-1,0]],"B:1,0":[[1,0],[0,1]],"B:1,1":[[0,-1],[1,0]],"L:-1,1":[[-1,0],[0,1]],"U:-1,1":[[-1,0],[0,-1]],"U:-1,0":[[0,1],[0,-1]]};
// a turn (two openings at right angles) is drawn as a smooth arc; the traveller and pit sit on its middle
const isTurn=ex=>ex.length===2&&ex[0][0]*ex[1][0]+ex[0][1]*ex[1][1]===0;
function anchorSpin(st){if(!isTurn(st.ex))return[0,0];const sx=st.ex[0][0]+st.ex[1][0],sy=st.ex[0][1]+st.ex[1][1];return[.132*sx,.132*sy]}
function anchorG(st){const[ax,ay]=anchorSpin(st),t=st.spin.rotation.z;return V(ax*Math.cos(t)-ay*Math.sin(t),ax*Math.sin(t)+ay*Math.cos(t),.085)}
function drawPath(grp,ex,pm){grp.clear();if(!ex.length)return;
  if(isTurn(ex)){const W=.17,H=.07,R=.45,sx=ex[0][0]+ex[1][0],sy=ex[0][1]+ex[1][1],cx=sx*.45,cy=sy*.45;
    let t1=Math.atan2(ex[0][1]*.45-cy,ex[0][0]*.45-cx),t2=Math.atan2(ex[1][1]*.45-cy,ex[1][0]*.45-cx);
    if(((t2-t1)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)>Math.PI){const k=t1;t1=t2;t2=k}if(t2<t1)t2+=2*Math.PI;
    const sh=new THREE.Shape();sh.absarc(cx,cy,R+W/2,t1,t2,false);sh.absarc(cx,cy,R-W/2,t2,t1,true);
    const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:H,bevelEnabled:false,curveSegments:20}),pm);m.position.z=.015;grp.add(m);return}
  if(ex.length===2&&ex[0][0]===-ex[1][0]&&ex[0][1]===-ex[1][1]){const W=.17,H=.07;const s=new THREE.Mesh(new THREE.BoxGeometry(ex[0][0]?.92:W,ex[0][0]?W:.92,H),pm);s.position.z=.015+H/2;grp.add(s);return}const W=.17,H=.07,Z=.015+H/2;const hub=new THREE.Mesh(new THREE.BoxGeometry(W,W,H),pm);hub.position.z=Z;grp.add(hub);
  ex.forEach(([du,dv])=>{const L=.45-W/2;const s=new THREE.Mesh(new THREE.BoxGeometry(du?L+.01:W,dv?L+.01:W,H),pm);s.position.set(du*(W/2+L/2),dv*(W/2+L/2),Z);grp.add(s)})}
const CROSS=[[1,0],[-1,0],[0,1],[0,-1]];
// entrance tiles: dead end, L, straight, T or cross — always keeping at least one of its own (solved-state) openings
// entrance tiles keep all of their own openings (so a solved cube always reaches them) and sometimes gain one more:
// the result is a dead end, L, straight, T or cross
function makeEntranceShape(st){const keep=st.ex.map(e=>e.slice());
  if(false){const extra=shuffle(CROSS.filter(e=>!keep.some(k=>k[0]===e[0]&&k[1]===e[1])))[0];keep.push(extra.slice())}
  st.ex=keep;drawPath(st.paths,st.ex,st.pm)}
function makeCross(st){st.ex=CROSS.map(e=>e.slice());{const en=ENT.find(e=>e.st===st);if(en)en.dot.position.set(0,0,0)}if(st===on)setTimeout(()=>player.position.copy(anchorG(st)));st.rot=0;st.spin.rotation.z=0;drawPath(st.paths,st.ex,st.pm)}
// only some edge pieces are 'bridges' that carry a path round the cube's edge:
// the four round the top face, plus one down to the bottom face. They move when you turn rows.
const BRIDGE=p=>(p.y===1&&(p.x===0||p.z===0))||(p.y===-1&&p.z===1&&p.x===0)||(p.y===0&&p.x===1&&p.z===1);
const cube=new THREE.Group();scene.add(cube);
const cubies=[],stickers=[];let cid=0;
for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
  const c=new THREE.Group();c.position.set(x*G,y*G,z*G);c.userData.id=cid++;cube.add(c);
  c.add(new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x14131d,roughness:.7})));
  const p=V(x,y,z);
  FACES.forEach(f=>{if(Math.round(p.dot(f.n))!==1)return;const cu=Math.round(p.dot(f.u)),cv=Math.round(p.dot(f.v));
    const ex=[];const add=(a,b)=>{if(!ex.some(e=>e[0]===a&&e[1]===b))ex.push([a,b])};
    const isCenter=cu===0&&cv===0;
    // solved picture: ONE unbroken loop that runs through all 54 tiles and over every face
    HAM[f.k+':'+cu+','+cv].forEach(([a,b])=>add(a,b));
    const g=new THREE.Group();g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(f.u,f.v,f.n));g.position.copy(f.n).multiplyScalar(.5);c.add(g);
    const spin=new THREE.Group();g.add(spin);
    const base=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.03),new THREE.MeshStandardMaterial({color:new THREE.Color(f.col),roughness:.45}));spin.add(base);
    const pm=new THREE.MeshStandardMaterial({color:0x1d1b27,roughness:.45});const paths=new THREE.Group();spin.add(paths);drawPath(paths,ex,pm);
    const cover=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.08),new THREE.MeshStandardMaterial({color:0x050507,roughness:.9,emissive:0x000000}));cover.position.z=.04;cover.visible=false;g.add(cover);
    const st={g,spin,paths,base,pm,cover,col:f.col,ex,rot:0,black:false,center:isCenter,cubie:c};base.userData.st=st;cover.userData.st=st;stickers.push(st)});
  cubies.push(c)}
const coreCubie=cubies.find(c=>c.position.lengthSq()<.01);

// sticker geometry in the world, recomputed on demand
const tmpQ=new THREE.Quaternion();
let fver=0,posMap=null;
function frame(st){if(st._fv===fver)return st._f;st.g.getWorldQuaternion(tmpQ);const X=V(1,0,0).applyQuaternion(tmpQ).round(),Y=V(0,1,0).applyQuaternion(tmpQ).round(),N=V(0,0,1).applyQuaternion(tmpQ).round();
  st._fv=fver;return st._f={X,Y,N,P:st.g.getWorldPosition(V(0,0,0))}}
const pkey=(p,n)=>[p.x,p.y,p.z,n.x,n.y,n.z].map(v=>Math.round(v*10)).join();
function stAt(p,n){if(!posMap||posMap.v!==fver){posMap=new Map();posMap.v=fver;stickers.forEach(s=>{const f=frame(s);posMap.set(pkey(f.P,f.N),s)})}return posMap.get(pkey(p,n))}
function worldExits(st){const{X,Y}=frame(st);return st.ex.map(([u,v])=>{for(let i=0;i<st.rot;i++)[u,v]=[-v,u];return X.clone().multiplyScalar(u).add(Y.clone().multiplyScalar(v)).round()})}
const has=(list,w)=>list.some(e=>e.equals(w));
// neighbour across a sticker edge in world direction w: same face, or wrap round the cube edge
function neighbour(st,w){const f=frame(st);const q=f.P.clone().add(w.clone().multiplyScalar(G));
  if(Math.abs(q.x)<1.6*G&&Math.abs(q.y)<1.6*G&&Math.abs(q.z)<1.6*G&&Math.abs(q.dot(f.N)-1.5*G)<.3){
    return{st:stAt(q,f.N),back:w.clone().negate()}}
  return{st:stickers.find(s=>s.cubie===st.cubie&&frame(s).N.equals(w)),back:f.N.clone(),wrap:true}}
function linked(a,w){const nb=neighbour(a,w);if(!nb.st)return null;if(nb.st.black)return{...nb,hole:true};return has(worldExits(nb.st),nb.back)?nb:null}

// ================= layer turns =================
let turning=false,solving=false;const queue=[],log=[];
const AX=[V(1,0,0),V(0,1,0),V(0,0,1)];
function snap(c){c.position.set(Math.round(c.position.x/G)*G,Math.round(c.position.y/G)*G,Math.round(c.position.z/G)*G);
  const m=new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);const e=m.elements;for(let i=0;i<16;i++)e[i]=Math.round(e[i]);c.quaternion.setFromRotationMatrix(m)}
function turn(axis,idx,dir,dur=.22){return new Promise(res=>{queue.push({axis,idx,dir,dur,res});if(!turning)next()})}
function next(){const mv=queue.shift();if(!mv){turning=false;if(solving){log.length=0;solving=false}checkFaces();hud();return}turning=true;
  const piv=new THREE.Group();cube.add(piv);const L=cubies.filter(c=>Math.round(c.position.dot(mv.axis)/G)===mv.idx);L.forEach(c=>piv.attach(c));
  tween(mv.dur,k=>{const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;piv.setRotationFromAxisAngle(mv.axis,mv.dir*Math.PI/2*e)}).then(()=>{L.forEach(c=>{cube.attach(c);snap(c)});cube.remove(piv);fver++;
    if(mv.dir&&!solving)log.push(mv);mv.res&&mv.res();next()})}

// ================= faces complete → paths realign and glow =================
let facesDone=0;
// a finished face turns each tile back the way it was drawn (centres can come back twisted, so match the world directions)
function alignHome(s){if(!s.homeW)return;const k0=s.rot;let best=0;
  for(let k=0;k<4;k++){s.rot=k;const w=worldExits(s);if(w.length===s.homeW.length&&w.every(x=>has(s.homeW,x))){best=k;break}}
  s.rot=best;s.spin.rotation.z=best*Math.PI/2;if(s===on&&k0!==best)player.position.copy(anchorG(s))}
function checkFaces(){let n=0;
  FACES.forEach(f=>{const on=stickers.filter(s=>frame(s).N.equals(f.n));const one=on.every(s=>s.col===on[0].col);if(one)n++;
    on.forEach(s=>{if(one)alignHome(s);s.pm.color.set(one?0x2b1d5c:0x1d1b27);s.pm.emissive=new THREE.Color(one?0x5a3fd0:0x000000)})});
  if(n>facesDone&&started){toast(n===6?'ALL SIX FACES!\nThe true ending awaits…':`FACE COMPLETE · ${n}/6`)}facesDone=n}

// ================= traveller =================
const player=new THREE.Group();scene.add(player);const pm=std('#3b78c9',{roughness:.35});
const body=new THREE.Group();player.add(body);
const pb=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.2,20),pm);pb.rotation.x=Math.PI/2;pb.position.z=.2;body.add(pb);
[.1,.3].forEach(z=>{const s=new THREE.Mesh(new THREE.SphereGeometry(.11,20,14),pm);s.position.z=z;body.add(s)});
const halo=new THREE.Mesh(new THREE.SphereGeometry(.04,12,8),new THREE.MeshBasicMaterial({color:0x8affc1}));halo.position.z=.5;body.add(halo);
let on=null,goal=null,arrived=false;const myTurns=[];
const beacon=new THREE.Group();
{const fr=new THREE.Mesh(new THREE.RingGeometry(.46,.56,4,1),new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,side:2,depthTest:false}));fr.rotation.z=Math.PI/4;fr.renderOrder=8;beacon.add(fr);
 const col=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.4,12,1,true),new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:.35,side:2,depthWrite:false}));col.rotation.x=Math.PI/2;col.position.z=.7;beacon.add(col);beacon.userData={fr,col}}

// ================= state =================

const routeToHole=()=>bfs(s=>s.black);
async function walk(path){for(const st of path){const a=frame(on),b=frame(st);const wrap=!a.N.equals(b.N);

// arrow keys: pick the tile direction that best matches the screen direction
const camDir=k=>{const r=V(1,0,0).applyQuaternion(cam.quaternion),u=V(0,1,0).applyQuaternion(cam.quaternion);return k==='up'?u:k==='down'?u.negate():k==='right'?r:r.negate()};

async function enterGoal(){if(on!==goal||busy)return;const g=goal;g.black=true;g.cover.visible=true;await fallInto(g)}

  const fl=(x,b)=>tween(.35,k=>{x.g.scale.set(1,Math.abs(Math.cos(k*Math.PI)),1);if(k>=.5)x.cover.visible=b}).then(()=>{x.g.scale.set(1,1,1);x.black=b;x.cover.visible=b});

function afterChange(){hud();if(goal&&on!==goal&&bfs(s=>s===goal)){toast('A path to the glowing tile is open!\nSwitch to Explore');$('modeb')&&$('modeb').classList.add('pulse');return}const p=routeToHole();if(p){toast('Path connected!\nSwitch to Explore and walk in');$('modeb')&&$('modeb').classList.add('pulse')}}

// ================= hints (pink, only when asked) =================
const hintM=new THREE.Mesh(new THREE.RingGeometry(.42,.6,4,1),new THREE.MeshBasicMaterial({color:0xff7aa2,transparent:true,opacity:0,side:2,depthTest:false}));hintM.renderOrder=9;scene.add(hintM);

    if(p)return hintSt(p[p.length-1],'Path is ready — switch to Explore');

    if(hole)for(const s of stickers){if(s.black)continue;const r0=s.rot;for(let k=1;k<4;k++){s.rot=(r0+k)%4;if(routeToHole()){s.rot=r0;return hintSt(s,`Tap this tile ${k===1?'once':k+' times'}`)}}s.rot=r0}
    for(const s of stickers){if(s.black||s.center||s===on)continue;const was=hole;if(was)was.black=false;s.black=true;const ok=routeToHole();s.black=false;if(was)was.black=true;if(ok)return hintSt(s,'Hold this tile to open a hole')}

  if(where==='room'&&room.kind==='A'){if(room.hatch)return roomHint(1,1,'Step into the hole');
    let best=null;for(let m=1;m<8;m++){const o=room.on.slice();const seq=[];room.BTN.forEach((b,i)=>{if(m>>i&1){b.t.forEach(x=>o[x]=!o[x]);seq.push(b)}});if(o.every(x=>x)&&(!best||seq.length<best.length))best=seq}

  const walls=[];const H=2.6,W=3*S;
  const wall=(nx,nz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(nx?.12:W+.24,H,nz?.12:W+.24),std(wallCol,{roughness:.9}));
    m.position.set(nx*(W/2+.06),RY+H/2,nz*(W/2+.06));m.receiveShadow=true;roomG.add(m);m.userData.n=new THREE.Vector3(nx,0,nz);walls.push(m);

    if(outside){const w=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.1),new THREE.MeshBasicMaterial({color:0x8fd8ff}));
      const tx=nz?-.8:0,tz=nx?.8:0;w.position.set(nx*(W/2-.005)+tx,RY+1.35,nz*(W/2-.005)+tz);w.lookAt(new THREE.Vector3(tx,RY+1.35,tz));m.userData.win=w;roomG.add(w);

function buildRoomA(r,c){// top layer: three lamps, three floor buttons

  const board=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,.05),std('#f4f2ec'));board.position.set(.75,RY+1.4,-1.5*S+.1);roomG.add(board);

function buildCore(){
  const g=new THREE.Group();g.position.y=RY;roomG.add(g);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.2,48),std('#151824'));disc.position.y=-.1;disc.receiveShadow=true;g.add(disc);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3,.04,8,64),new THREE.MeshBasicMaterial({color:0xff7a59}));ring.rotation.x=Math.PI/2;g.add(ring);
  const holo=new THREE.Group();holo.position.set(0,2.1,-1.2);g.add(holo);
  for(let L=0;L<3;L++)for(let r=0;r<3;r++)for(let c=0;c<3;c++){const k=L+','+r+','+c,isCore=k==='1,1,1',done=solvedAt(k);

    m.position.set((c-1)*.38,(1-L)*.38,(r-1)*.38);holo.add(m)}

function typeOf(c){const p=posOf(c);const n=(p.x!==0)+(p.y!==0)+(p.z!==0);return n===3?'Corner':n===2?'Edge':n===1?'Center':'Core'}
function layerName(c){const y=posOf(c).y;return y===1?'TOP':y===0?'MIDDLE':'BOTTOM'}
async function tapRoomCell(r,c){if(busy)return;act();
  if(room.kind==='A'){const isBtn=(i,j)=>room.BTN.some(b=>b.r===i&&b.c===j);
    const key=(i,j)=>i+','+j,prev={},q=[[rr,rc]];prev[key(rr,rc)]=null;let found=r===rr&&c===rc;
    while(q.length&&!found){const[i,j]=q.shift();for(const[dx,dz]of[[0,-1],[1,0],[0,1],[-1,0]]){const ni=i+dz,nj=j+dx;if(ni<0||ni>2||nj<0||nj>2||key(ni,nj)in prev)continue;

    if(!found||(r===rr&&c===rc))return;const path=[];let k=key(r,c);while(k&&k!==key(rr,rc)){path.unshift(k.split(',').map(Number));k=prev[k]}

    await tween(.3,k=>{player.position.lerpVectors(from,to,k);player.position.y+=Math.sin(k*Math.PI)*.12});rr=r;rc=c}}

        setTimeout(()=>{room.gem.visible=false;giveItem(e.item);markSolved(e)},900)}}}
  else if(!room.done){room.black.add(rr+','+rc);room.sh.floor[rr*3+rc].material=std('#111');

  else{room.black.clear();room.sh.floor.forEach(t=>t.material=std('#e9e6df'))}rr=1;rc=1;player.position.copy(roomPos(1,1));hud()}

  await tween(1,k=>{player.position.copy(p0).add(f.N.clone().multiplyScalar(-k*k*1.6));st.g.position.copy(st.g.parent.worldToLocal?st.g.position:st.g.position);if(k>.6)$('fade').style.opacity=(k-.6)/.4});

  await tween(.8,k=>ks.forEach(s=>{const[i,j]=s.split(',').map(Number);room.sh.floor[i*3+j].position.y=RY+.06-k*1.5}));
  const p0=player.position.clone();await tween(.9,k=>{player.position.y=p0.y-k*k*2.5;if(k>.5)$('fade').style.opacity=(k-.5)/.5});toCore()}
async function toCore(){clearRoom();solvedIds.add(coreCubie.userData.id);room=buildCore();where='core';
  player.position.set(0,RY+4,1.2);camSnap();await Promise.all([fade(0,.5),tween(.8,k=>player.position.y=RY+4-k*k*4)]);busy=false;hud();
  const n=solvedIds.size,p=$('panel');
  p.innerHTML=`<h2>You reached the CORE</h2><p>Normal ending ✓</p><p><b>${n} / 27</b> rooms solved · <b>${facesDone} / 6</b> faces restored.<br>Restore all six faces for the true ending.</p>`;

  if(room.kind==='clock'){if(room.done){toast('Only Roman numerals left');return}
    if(obj!==room.hits[0]){toast('Look closely —\none numeral is not like the others');return}
    room.done=true;drawClock(room.ctx,e.item.v,true);room.tex.needsUpdate=true;room.ring.visible=false;
    const fly=new THREE.Mesh(new THREE.PlaneGeometry(.5,.5),new THREE.MeshBasicMaterial({map:label(String(e.item.v),{bg:'#fff',fg:'#d8352e'}),transparent:true}));fly.position.copy(room.p);roomG.add(fly);
    const to=cam.position.clone().lerp(room.p,.6);await tween(.8,k=>{fly.position.lerpVectors(room.p,to,k);fly.lookAt(cam.position);fly.material.opacity=1-k*k});roomG.remove(fly);
    if(e===ENT[1])visitedTut=true;giveItem(e.item);markSolved(e);return}
  if(room.done){toast('Already solved');return}
  const need={sudoku:'Which number fits here?\nTap it in your bag (bottom-left)',gemdoor:'The socket wants a gem.\nTap the right colour in your bag',pedestal:'Find the matching shape\nand tap it in your bag'}[room.kind];
  if(need)toast(inv.length?need:need.split('\n')[0]+'\nYour bag is empty — find it in another room')}
let painting=false;
async function usePower(item){
  if(item.kind==='compass'){if(where!=='surface'){toast('🧭 Use the guiding light\non the cube surface');return}
    const open=ENT.filter(x=>!x.solved&&x.st!==on);if(!open.length){toast('No rooms left to find');return}
    const d=x=>frame(x.st).P.distanceTo(frame(on).P);const t=open.sort((a,b)=>d(a)-d(b))[0];inv=inv.filter(x=>x!==item);setGoal(t.st);
    toast(`🧭 The nearest unsolved room\nis now glowing`);hud();return}
  if(item.kind==='pen'){if(where!=='surface'){toast('✏️ Use the pen\non the cube surface');return}
    painting=item;hud();toast('✏️ Tap a tile to draw\na crossroad on it');}}
function paintTile(st){if(st.ex.length===4){toast('That tile is already a crossroad');return}
  makeCross(st);inv=inv.filter(x=>x!==painting);painting=false;
  const s0=st.spin.scale.clone();tween(.4,k=>st.spin.scale.setScalar(1+Math.sin(k*Math.PI)*.15)).then(()=>st.spin.scale.copy(s0));toast('✏️ Crossroad drawn!');hud();afterChange()}
async function useItem(item){act();if(busy)return;if(item.power)return usePower(item);
  if(where!=='room'||!room.slot||room.done){toast(`${item.glyph} ${item.name}\nUse it inside a room that needs it`);return}
  const e=room.ent;
  if(item.id!==e.item.id){toast(room.kind==='sudoku'?`${item.glyph} doesn't fit —\ncheck the rows, columns and boxes`:`${item.glyph} doesn't fit here`);
    const el=document.querySelector(`#inv [data-id="${item.id}"]`);if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),500)}return}
  inv=inv.filter(x=>x!==item);room.done=true;room.ring.visible=false;busy=true;
  if(room.kind==='sudoku'){const m=room.slot;m.material[2]=new THREE.MeshStandardMaterial({map:label(String(item.v),{bg:'#c9f2d6',fg:'#1b6b3a'})});await tween(.4,k=>m.position.y=.06+Math.sin(k*Math.PI)*.25);toast('SUDOKU COMPLETE!')}
  if(room.kind==='gemdoor'){room.gem.visible=true;const y0=room.door.position.y;await tween(.9,k=>room.door.position.y=y0+k*2.2);toast('THE DOOR OPENS!')}
  if(room.kind==='pedestal'){room.prize.visible=true;const y0=room.prize.position.y;await tween(.6,k=>room.prize.position.y=y0+Math.sin(k*Math.PI)*.3);toast('IT FITS!')}
  busy=false;markSolved(e)}

// ================= camera =================
let az=35,el=32;const camLook=V(0,0,0);
function faceCamTo(n){if(Math.abs(n.y)>.5){el=n.y>0?55:-55}else{el=25;az=Math.atan2(n.x,n.z)*180/Math.PI+20}}
function camGoal(){let tgt,d,e=el;
  if(where==='surface'){if(mode==='puzzle'){tgt=V(0,0,0);d=8.6}else{tgt=player.getWorldPosition(V(0,0,0));d=5.2}}
  else if(where==='room'){tgt=V(0,RY+.9,0);d=8.2;e=Math.max(Math.abs(el),42)}else{tgt=V(0,RY+2.2,0);d=8.5;e=Math.max(Math.abs(el),20)}
  d*=Math.max(1,.75/cam.aspect*.75+.25);const a=az*Math.PI/180,er=e*Math.PI/180;
  return{tgt,pos:tgt.clone().add(V(Math.sin(a)*Math.cos(er)*d,Math.sin(er)*d,Math.cos(a)*Math.cos(er)*d))}}
function camSnap(){const g=camGoal();cam.position.copy(g.pos);camLook.copy(g.tgt);cam.lookAt(camLook)}
function camUpdate(dt){const g=camGoal();cam.position.lerp(g.pos,Math.min(1,dt*6));camLook.lerp(g.tgt,Math.min(1,dt*6));cam.lookAt(camLook)}

// ================= input: tap / hold / swipe =================
let drag=null;const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e,objs){const r=ren.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);return ray.intersectObjects(objs,false)[0]}
const stickerMeshes=()=>stickers.flatMap(s=>[s.base,s.cover]);
function toScreen(p){const v=p.clone().project(cam);return new THREE.Vector2((v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight)}
ren.domElement.addEventListener('pointerdown',e=>{ren.domElement.setPointerCapture(e.pointerId);
  const h=where==='surface'?pick(e,stickerMeshes()):null;
  drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,held:false,turned:false,st:h?h.object.userData.st:null,pt:h?h.point.clone():null};
  });
ren.domElement.addEventListener('pointermove',e=>{if(!drag)return;const d=drag;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>14){d.moved=true;clearTimeout(d.timer)}
  if(where==='surface'&&mode==='puzzle'&&d.st){// swipe a sticker = turn its row
    if(!d.moved||d.turned||turning||busy)return;const sw=new THREE.Vector2(e.clientX-d.x,e.clientY-d.y);if(sw.length()<20)return;
    const n=frame(d.st).N,P=d.pt,s0=toScreen(P);let best=null;
    AX.forEach(ax=>{if(Math.abs(ax.dot(n))>.5)return;const dd=toScreen(P.clone().add(ax.clone().cross(P).multiplyScalar(.3))).sub(s0);
      const sc=dd.normalize().dot(sw.clone().normalize());if(!best||Math.abs(sc)>Math.abs(best.sc))best={ax,sc}});
    if(best&&Math.abs(best.sc)>.5){d.turned=true;act();const mv={ax:best.ax,idx:Math.round(d.st.cubie.position.dot(best.ax)/G),dir:Math.sign(best.sc)};myTurns.push(mv);turn(mv.ax,mv.idx,mv.dir).then(()=>{afterChange();hud()})}return}
  if(d.moved){az-=(e.clientX-d.lx)*.35;el=Math.max(-80,Math.min(80,el+(e.clientY-d.ly)*.3))}d.lx=e.clientX;d.ly=e.clientY});
ren.domElement.addEventListener('pointerup',e=>{const d=drag;drag=null;if(!d)return;clearTimeout(d.timer);if(d.moved||d.held||busy||turning)return;
  if(where==='surface'&&d.st){painting?paintTile(d.st):mode==='puzzle'?spinTile(d.st):walkTo(d.st)}
  else if(where==='room'){if(room.hits){const h=pick(e,room.hits);if(h)tapRoomThing(h.object)}else{const h=pick(e,room.sh.floor);if(h){const i=room.sh.floor.indexOf(h.object);tapRoomCell(Math.floor(i/3),i%3)}}}});
addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();toggleMode();return}const K={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];
  if(K){e.preventDefault();keyStep(K)}if(e.key==='Enter'&&where==='surface'&&entAt(on))enterRoom();if(e.key==='Escape')leaveRooms()});

// ================= HUD =================
function setMode(m){if(where!=='surface'||busy||mode===m)return;painting=false;mode=m;if(m==='explore')faceCamTo(frame(on).N);else el=Math.max(el,30);act();hud()}
function undoTurn(){if(turning||busy)return;const mv=myTurns.pop();if(!mv){toast('Nothing to undo');return}act();turn(mv.ax,mv.idx,-mv.dir).then(()=>{afterChange();hud()})}
function toggleMode(){if(where!=='surface'||busy)return;painting=false;mode=mode==='explore'?'puzzle':'explore';act();hud()}
function scramble(n=20){let last=-1;for(let i=0;i<n;i++){let a;do a=Math.floor(Math.random()*3);while(a===last);last=a;turn(AX[a],Math.floor(Math.random()*3)-1,Math.random()<.5?1:-1,0)}}
function autoSolve(){if(turning||busy||!log.length)return;solving=true;act();const h=log.splice(0);h.reverse().forEach(m=>turn(m.axis,m.idx,-m.dir,.07))}
function hud(){let help='',stat='';const bb='style="display:inline;font-size:inherit"';const gl=(goal&&where==='surface'?'<br><span style="color:#ffd166">★ Walk to the glowing tile.</span>':'')+(painting?'<br><span style="color:#ff8a7a">✏️ Tap a tile to draw a crossroad.</span>':'');
  if(where==='surface'){help=mode==='puzzle'?`<b style="color:#f2a33a">PUZZLE MODE</b><i><b ${bb}>Swipe</b> a tile: turn its whole row.<br><b ${bb}>Tap</b> a tile: spin just that tile.</i>`
      :`<b style="color:#7fe0a8">EXPLORATION MODE</b><i><b ${bb}>Arrow keys</b> or <b ${bb}>tap</b> a tile to walk — paths can wrap round the cube's edges.<br>⚪ pit = a way down into a room · ◼ gold = solved.</i>`;
    stat=`FACES <span style="color:#1fd6e0">${facesDone} / 6</span>`}
  else if(where==='room'){const c=entry.a,e=room.ent,nm=`<b style="color:#ffe27a">${NAMES[e.type].toUpperCase()} · ${layerName(c)} ${typeOf(c).toUpperCase()}</b>`;
    const tip={clock:'Tap the numeral that doesn\'t belong.',sudoku:'Work out the missing number, then tap it in your bag.',lamps:'Tap the floor to walk. Light all three lamps.',stroke:'Tap a tile next to you. Draw the wall\'s shape in one stroke.',gemdoor:'Tap the matching gem in your bag.',pedestal:'Tap the matching shape in your bag.'}[e.type];
    help=nm+`<i>${room.done?'Solved ✓ — tap Up.':tip}</i>`;stat='INSIDE THE CUBE'}
  else if(false){const c=entry.a;help=room.kind==='sudoku'?`<b style="color:#ffe27a">SUDOKU ROOM · ${layerName(c)} ${typeOf(c).toUpperCase()}</b><i>${room.done?'Solved!':'Tap the empty square.'}</i>`:`<b style="color:#9fd0ff">CLOCK ROOM · ${layerName(c)} ${typeOf(c).toUpperCase()}</b><i>${room.done?'You took the 3.':'Tap the number that doesn\'t belong.'}</i>`;stat='INSIDE THE CUBE'}
  else if(where==='room'){const c=room.kind==='A'?entry.a:entry.b;help=room.kind==='A'?`<b style="color:#ffe27a">${layerName(c)} LAYER · ${typeOf(c).toUpperCase()}</b><i>Arrow keys or tap the floor to walk. Light all three lamps.</i>`
      :`<b style="color:#9fd0ff">${layerName(c)} LAYER · ${typeOf(c).toUpperCase()}</b><i>Arrow keys or tap a tile next to you. Stepped tiles turn black. Draw the wall's shape in one stroke.</i>`;stat='INSIDE THE CUBE'}
  else{help='<b style="color:#ff9c7a">THE CORE</b><i>The hidden 27th room.</i>';stat='CORE'}
  $('help').innerHTML=help+gl;$('stat').innerHTML=stat+`<br>ROOMS <span style="color:#f2c14e">${ENT.filter(x=>x.solved).length} / 26</span>`+(where==='surface'&&mode==='puzzle'?'<br><a href="#" id="dbg" style="color:#8a86a8;font-size:10px">dev: auto-solve</a>':'');const dbg=$('dbg');if(dbg)dbg.onclick=ev=>{ev.preventDefault();myTurns.length=0;autoSolve()};
  const here=where==='core'?'1,1,1':where==='room'?keyOf(entry.a):null;let m='';
  ['TOP','MID','BOT'].forEach((nm,L)=>{m+=`<div class="lay">${nm}<div class="g">`;for(let r=0;r<3;r++)for(let c=0;c<3;c++){const k=L+','+r+','+c;
      m+=`<span class="${[solvedAt(k)?'done':'',here===k?'here':'',k==='1,1,1'?'core':''].join(' ')}"></span>`}m+='</div></div>'});$('map').innerHTML=m;
  const bar0=$('bar');bar0.innerHTML='';const row=document.createElement('div');row.className='row';bar0.appendChild(row);
  const B=(t,f,id,cls='')=>{const b=document.createElement('button');b.className='b '+cls;if(id)b.id=id;b.innerHTML=t;b.onclick=f;row.appendChild(b);return b};
  if(where==='surface'){
    if(entAt(on)&&arrived&&!painting)B('▶ 3D Puzzle',enterRoom,'puzb','go3 pulse');
    const seg=document.createElement('div');seg.className='seg';row.appendChild(seg);
    [['puzzle','🧩 Puzzle'],['explore','🚶 Explore']].forEach(([m,t])=>{const b=document.createElement('button');b.className='segb'+(mode===m?' on':'');b.innerHTML=t;b.onclick=()=>setMode(m);if(m!==mode)b.id='modeb';seg.appendChild(b)});
    if(painting)B('✕ Cancel pen',()=>{painting=false;hud()});
    else if(mode==='puzzle'){B('↶',undoTurn,'',(myTurns.length?'':'dim ')+'sq').title='Undo';B('◀',()=>{az+=90;act()},'','sq');B('▶',()=>{az-=90;act()},'','sq')}}
  else if(where==='room'){if(!room.hits&&!room.done)B('⟲ Reset',resetRoom);B('↑ Up',leaveRooms,'leaveb',leaveGlow?'go3 pulse':'')}
  if(where==='surface'&&ENT.length&&ENT.every(x=>x.solved))B('◉ Enter the Core',()=>{busy=true;fade(1,.5).then(()=>{cube.visible=false;scene.attach(player);body.rotation.set(-Math.PI/2,0,0);toCore()})},'coreb','go3 pulse');
  const g=$('gest');g.textContent=where==='surface'?(painting?'Tap any tile to draw a crossroad':mode==='puzzle'?'Swipe tile: turn row · Tap: spin tile · ↶ undo · ◀ ▶ look around':'Tap a tile or arrow keys: walk · Drag: look around'):where==='room'?(room.hits?'Tap things in the room · Tap a bag item to use it':'Tap the floor or arrow keys: walk'):'';
  // bag
  const iv=$('inv');iv.innerHTML=inv.length?'<div class="ttl">BAG</div>':'<div class="ttl">BAG · empty</div>';
  inv.forEach(it=>{const d=document.createElement('button');d.className='chip';d.dataset.id=it.id;d.title=it.name;d.innerHTML=`<span style="color:${it.color}">${it.glyph}</span>`;d.onclick=()=>useItem(it);iv.appendChild(d)})}
function toast(s){const el=$('toast');el.innerHTML=s.replace(/\n/g,'<br><span style="font-size:16px;font-weight:600">');el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,2000)}

// ================= loop =================
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,now=performance.now();
  stickers.forEach(s=>{if(s.black)s.cover.material.emissive.setRGB(.22+.18*Math.sin(t*4),.06+.05*Math.sin(t*4),0)});
  halo.position.z=.5+Math.sin(t*3)*.03;ENT.forEach((e,i)=>{if(!e.solved&&e.dot.userData.glow)e.dot.userData.glow.material.opacity=.18+.14*Math.sin(t*2+i)});if(beacon.visible){beacon.userData.fr.material.opacity=.6+.4*Math.sin(t*4);beacon.userData.col.material.opacity=.2+.15*Math.sin(t*4)}
  
  hintM.material.opacity=hintUntil>now?.55+.35*Math.sin(t*6):Math.max(0,hintM.material.opacity-dt*2);
  if(room&&room.sh){const cd=V(cam.position.x,0,cam.position.z).normalize();room.sh.walls.forEach(w=>{const vis=w.userData.n.dot(cd)<.35;w.visible=vis;if(w.userData.win){w.userData.win.visible=vis;w.userData.fr.visible=vis}})}
  if(room&&room.kind==='core')room.holo.rotation.y=t*.4;if(room&&room.ring)room.ring.material.opacity=.55+.45*Math.sin(t*4);
  camUpdate(dt);ren.render(scene,cam)}
stickers.forEach(s=>s.homeW=worldExits(s));// remember how every tile is drawn on the finished cube
scramble(20);queue.push({axis:AX[0],idx:9,dir:0,dur:0,res:()=>{log.length=log.length;standOn(startSticker());setTimeout(()=>started=true,50);faceCamTo(V(0,1,0));camSnap();jumbleTiles();makeEntrances();tuneStart();refreshGoal();hud();setTimeout(()=>toast('Find a way to the glowing tile'),600)}});
loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

</script>
